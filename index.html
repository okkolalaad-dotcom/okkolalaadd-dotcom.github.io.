  </div>

    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl max-h-[90vh] overflow-y-auto">

        </div>
        <div>

        </div>
        <button onclick="verifyPin()" class="w-full bg-sage-600 hover:bg-sage-700 text-white font-semibold text-xs py-2.5 rounded-xl shadow transition">

    ];

    let products = JSON.parse(localStorage.getItem('reseller_catalog_v2')) || defaultData;
    let currentCategory = 'all';
    let logoClickCount = 0;

    function formatRp(val) { 
      if (val === 0) return 'Tanya Admin';
      return 'Rp' + val.toLocaleString('id-ID'); 
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCatalog();

      if (window.location.hash === '#admin') {
        openAdminModal();
      }
    });

    function handleSecretLogoClick() {
      logoClickCount++;
      if (logoClickCount === 5) {
        logoClickCount = 0;
        openAdminModal();
      }
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-sage-600', 'text-white', 'shadow-sm');
        btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
        activeBtn.classList.add('bg-sage-600', 'text-white', 'shadow-sm');
      }
      renderCatalog();
    }

    function filterProducts() { renderCatalog(); }

    function renderCatalog() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesCat = currentCategory === 'all' || p.cat === currentCategory;
        const matchesSearch = p.brand.toLowerCase().includes(searchKeyword) || 
                              p.name.toLowerCase().includes(searchKeyword) ||
                              (p.desc && p.desc.toLowerCase().includes(searchKeyword)) ||
                              (p.note && p.note.toLowerCase().includes(searchKeyword));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
            <p class="text-xs">Produk tidak ditemukan.</p>
          </div>
        `;
        return;
      }

      const grouped = {};
      filtered.forEach(p => {
        if (!grouped[p.brand]) grouped[p.brand] = [];
        grouped[p.brand].push(p);
      });

      Object.keys(grouped).forEach(brandName => {
        const items = grouped[brandName];
        const firstItem = items[0];

        let itemsHtml = '';
        items.forEach(item => {
          const isReady = item.status === 'ready';

          itemsHtml += `
            <div class="py-2.5 border-b border-slate-100 last:border-none">
              <div class="flex items-start justify-between">
                <div class="pr-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-800">${item.name}</span>
                    ${!isReady ? '<span class="text-[9px] bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded font-bold">Habis</span>' : ''}
                  </div>
                  ${item.desc ? `<p class="text-[11px] text-slate-500 mt-0.5">${item.desc}</p>` : ''}
                </div>
                <div class="text-right flex-shrink-0">
                  <div class="text-xs font-bold text-sage-700">${formatRp(item.price)}</div>
                </div>
              </div>
              ${item.note ? `
                <div class="mt-1.5 flex items-center gap-1.5 text-[10px] text-amber-800 bg-amber-50/80 px-2 py-1 rounded-md border border-amber-200/60 font-medium">
                  <i class="fa-solid fa-circle-info text-amber-600 text-[9px]"></i>
                  <span>${item.note}</span>
                </div>
              ` : ''}
            </div>
          `;
        });

        const brandCard = `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70">
            <div class="flex items-center gap-2.5 pb-2.5 border-b border-slate-100 mb-1">
              <div class="w-8 h-8 rounded-xl bg-slate-50 flex items-center justify-center text-sm ${firstItem.color}">
                <i class="fa-solid ${firstItem.icon}"></i>
              </div>
              <div>
                <h2 class="font-bold text-slate-800 text-sm">${brandName}</h2>
                <span class="text-[10px] text-slate-400 font-medium">${items.length} Pilihan Paket</span>
              </div>
            </div>
            <div class="divide-y divide-slate-100">
              ${itemsHtml}
            </div>
          </div>
        `;
        container.innerHTML += brandCard;
      });
    }

    // ADMIN LOGIC
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('adminAuthView').classList.remove('hidden');
      document.getElementById('adminPanelView').classList.add('hidden');
      document.getElementById('pinInput').value = '';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
      history.replaceState(null, null, ' ');
    }

    function verifyPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '1234') {
        document.getElementById('adminAuthView').classList.add('hidden');
        document.getElementById('adminPanelView').classList.remove('hidden');
        renderAdminList();
      } else {
        alert('PIN Salah!');
      }
    }

    function renderAdminList() {
      const list = document.getElementById('adminProductList');
      list.innerHTML = '';
      products.forEach((p, index) => {
        list.innerHTML += `
          <div class="p-2.5 bg-slate-50 rounded-xl text-xs border border-slate-200 space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800">${p.brand} - ${p.name}</span>
              <span class="text-[10px] font-bold ${p.status === 'ready' ? 'text-emerald-600' : 'text-rose-600'}">${p.status.toUpperCase()}</span>
            </div>
            <div class="text-[11px] text-slate-600">
              Harga: <b>${formatRp(p.price)}</b> ${p.desc ? `• Deskripsi: ${p.desc}` : ''}
            </div>
            ${p.note ? `<div class="text-[10px] text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/50">Note: ${p.note}</div>` : ''}
            <div class="flex gap-1.5 pt-1">
              <button onclick="editProduct(${index})" class="flex-1 py-1 bg-amber-100 text-amber-800 rounded-lg text-[11px] font-semibold hover:bg-amber-200">
                <i class="fa-solid fa-pen-to-square"></i> Edit Detail
              </button>
              <button onclick="toggleStatus(${index})" class="px-2.5 py-1 bg-slate-200 text-slate-700 rounded-lg text-[11px] font-semibold">
                Stok
              </button>
              <button onclick="deleteProduct(${index})" class="px-2.5 py-1 bg-rose-100 text-rose-700 rounded-lg text-[11px] font-semibold">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    // FITUR EDIT DETAIL PRODUK SECARA LANGSUNG
    function editProduct(index) {
      const p = products[index];
      
      const newBrand = prompt('Nama Brand:', p.brand);
      if (newBrand === null) return;
      
      const newName = prompt('Nama Paket:', p.name);
      if (newName === null) return;
      
      const newDesc = prompt('Deskripsi Produk (Biarkan kosong jika tidak ada):', p.desc || '');
      if (newDesc === null) return;
      
      const newNote = prompt('Catatan Khusus (misal: Email buyer +4k):', p.note || '');
      if (newNote === null) return;
      
      const newPriceStr = prompt('Harga Jual (ketik 0 jika Tanya Admin):', p.price);
      if (newPriceStr === null) return;
      const newPrice = parseInt(newPriceStr) || 0;

      // Update data
      products[index].brand = newBrand.trim();
      products[index].name = newName.trim();
      products[index].desc = newDesc.trim();
      products[index].note = newNote.trim();
      products[index].price = newPrice;

      saveProducts();
      renderAdminList();
      renderCatalog();
      alert('Produk berhasil diperbarui!');
    }

    function toggleStatus(index) {
      products[index].status = products[index].status === 'ready' ? 'habis' : 'ready';
      saveProducts();
      renderAdminList();
      renderCatalog();
    }

    function deleteProduct(index) {
      if (confirm(`Hapus paket ${products[index].name}?`)) {
        products.splice(index, 1);
        saveProducts();
        renderAdminList();
        renderCatalog();
      }
    }

    function showAddProductForm() {
      const brand = prompt('Nama Brand (cth: Spotify Premium):');
      if (!brand) return;
      const name = prompt('Nama Paket (cth: Famplan 1 Bulan):');
      if (!name) return;
      const desc = prompt('Deskripsi Singkat (Opsional):') || '';
      const note = prompt('Catatan Khusus (Opsional):') || '';
      const price = parseInt(prompt('Harga Jual (ketik 0 jika Tanya Admin):') || '0');
      const cat = prompt('Kategori (Streaming / Design / Editing / Nokos):') || 'Streaming';

      products.push({
        id: Date.now(),
        brand: brand.trim(),
        cat: cat.trim(),
        name: name.trim(),
        desc: desc.trim(),
        note: note.trim(),
        price: price,
        status: 'ready',
        icon: 'fa-box',
        color: 'text-sage-600'
      });

      saveProducts();
      renderAdminList();
      renderCatalog();
    }

    function resetDefaultData() {
      if (confirm('Reset seluruh data ke daftar default baru? (Semua perubahan buatanmu akan kembali ke awal)')) {
        products = [...defaultData];
        saveProducts();
        renderAdminList();
        renderCatalog();
      }
    }

    function saveProducts() {
      localStorage.setItem('reseller_catalog_v2', JSON.stringify(products));
    }
  </script>
</body>
</html>
